<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#f59e0b" />
    <title>目前沒有網路｜結帳系統</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #fff7ed; color: #18181b; font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", sans-serif; }
      main { width: 100%; max-width: 420px; border: 1px solid #fed7aa; border-radius: 24px; background: white; padding: 32px 24px; text-align: center; box-shadow: 0 18px 50px rgba(154,52,18,.12); }
      img { width: 72px; height: 72px; border-radius: 18px; }
      h1 { margin: 20px 0 8px; font-size: 24px; }
      p { margin: 0; color: #71717a; line-height: 1.7; }
      button { width: 100%; margin-top: 24px; border: 0; border-radius: 14px; background: #f59e0b; color: white; padding: 14px 18px; font: inherit; font-weight: 700; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon-192.png" alt="結帳系統" />
      <h1>目前沒有網路</h1>
      <p>為保護帳目正確性，離線時無法送出帳目或照片。恢復網路後即可繼續使用。</p>
      <button type="button" onclick="location.reload()">重新連線</button>
    </main>
  </body>
</html>
